*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3,.f{font-family:Unbounded,'Plus Jakarta Sans',system-ui,sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
h1{font-size:28px;line-height:1.15}h2{font-size:20px}h3{font-size:15px}
p{margin:0}button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:480px;margin:0 auto;padding:16px 16px 120px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.mu{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.col{display:grid;gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ln);background:var(--s2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mu)}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:14px 18px;background:#f4f6f7;color:#08090a;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn>*{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px}
.btn::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--ac) 70%,transparent);transform:translateX(-110%) skewX(-20deg);transition:transform .55s}
.btn:hover::after,.btn:active::after{transform:translateX(110%) skewX(-20deg)}
.btn:active{transform:scale(.95)}.btn.blk{width:100%}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.g::after{background:rgba(255,255,255,.08)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:12px}.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ld{pointer-events:none}.btn.ld>*{opacity:0}.btn.ld::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #08090a44;border-top-color:#08090a;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
.in{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;outline:0;transition:.2s}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
label.l{display:grid;gap:6px;font-size:13px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;color:var(--mu);transition:.2s}.seg .on{background:var(--s2);color:var(--tx)}
.pb{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .6s}
/* splash */
#sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}

#sp.hd{opacity:0;visibility:hidden}#sp>div{position:relative;display:grid;justify-items:center;gap:18px}
.ring{width:88px;height:88px;border-radius:50%;border:2px solid var(--ln);border-top-color:var(--ac);animation:rot 1s linear infinite;position:absolute}
.logo{width:88px;height:88px;display:grid;place-items:center;font:700 34px Unbounded,sans-serif;position:relative}
.bar{height:3px;width:200px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);animation:fill 2.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes fill{to{width:100%}}
/* auth */
.ah{height:40px}.cv{width:260px;height:260px;border-radius:50%;overflow:hidden;margin:0 auto;position:relative;touch-action:none;border:2px solid var(--ac);background:#000;cursor:grab}.cv img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}input[type=range]{width:100%;accent-color:var(--ac)}.av{display:grid;place-items:center;border-radius:50%;background:var(--s2) center/cover;border:1px solid var(--ln);font-family:Unbounded,sans-serif;font-weight:700;color:var(--ac);flex:none;overflow:hidden}
/* hero */
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hero{position:relative;min-height:430px;border-radius:26px;overflow:hidden;border:1px solid var(--ln);background:var(--hero) 50% 22%/cover;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#08090a 6%,rgba(8,9,10,0) 60%)}
.hero .ht{position:relative;display:grid;gap:10px}
.dia{display:inline-flex;align-items:center;gap:6px;background:#08090acc;border:1px solid var(--ln);border-radius:99px;padding:7px 13px;font-weight:700;cursor:pointer;color:var(--ac)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st .card{padding:14px;text-align:center}.st b{font:700 20px Unbounded,sans-serif;display:block}
.q{display:grid;gap:10px}.q .row{align-items:flex-start}.q.dn{opacity:.55}.q b{display:block;font-size:15px}
.ic{width:36px;height:36px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);display:grid;place-items:center;color:var(--ac);flex:none}
.x{border:0;background:none;color:var(--mu);cursor:pointer;padding:6px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 8px 24px #000a}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln);z-index:20}
nav>div{max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nv{position:relative;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:9px 0 7px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mu);cursor:pointer;transition:.2s}
.nv::before,.nv::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--c);transition:.25s}
.nv::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.nv::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.nv.on{color:var(--tx);background:var(--s2)}.nv.on::before,.nv.on::after{width:18px;height:18px}
.nv:active{transform:scale(.93)}
/* modal */
#md{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:flex-end;justify-content:center}
#md.on{display:flex}
.sh{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--s1);border:1px solid var(--ln);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.up{display:grid;place-items:center;gap:6px;border:1px dashed var(--ln);border-radius:16px;min-height:120px;cursor:pointer;color:var(--mu);overflow:hidden;text-align:center;padding:10px}
.up img,.up video{width:100%;max-height:200px;object-fit:cover;border-radius:10px}.up.ok{border-style:solid;border-color:var(--ok)}
