name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "arise",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/local-notifications": "^6.1.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.arise.app",
            "appName": "Aries",
            "webDir": "www"
          }
          EOF
          npm install
          grep -rl "USAGE_NOTIFICATION" node_modules/@capacitor/local-notifications/android/src | xargs -r sed -i 's/USAGE_NOTIFICATION/USAGE_ALARM/g'
          npx cap add android
          mkdir -p android/app/src/main/res/raw
          cp alarm.wav android/app/src/main/res/raw/alarm.wav
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Ubah nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aries.apk
      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Aries build ${{ github.run_number }}
          files: Aries.apk
